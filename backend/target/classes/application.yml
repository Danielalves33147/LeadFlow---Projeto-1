spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: leadflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leadflow}
    username: ${DB_USERNAME:leadflow}
    password: ${DB_PASSWORD:leadflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

leadflow:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    expiration-seconds: ${JWT_EXPIRATION:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  demo:
    seed: ${DEMO_SEED:true}

  account:
    account:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    email-verification-expiration-seconds: ${EMAIL_VERIFICATION_EXPIRATION:86400}
    invitation-expiration-seconds: ${INVITATION_EXPIRATION:86400}

  email:
    mode: ${EMAIL_MODE:console}
    from: ${EMAIL_FROM:noreply@leadflow.local}