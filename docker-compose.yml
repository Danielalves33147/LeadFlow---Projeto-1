services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-leadflow}
      POSTGRES_USER: ${DB_USERNAME:-leadflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leadflow}
    ports:
      - "5432:5432"
    volumes:
      - leadflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-leadflow} -d ${DB_NAME:-leadflow}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-leadflow}
      DB_USERNAME: ${DB_USERNAME:-leadflow}
      DB_PASSWORD: ${DB_PASSWORD:-leadflow}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-production-123456789}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      DEMO_SEED: ${DEMO_SEED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  leadflow_pgdata:
